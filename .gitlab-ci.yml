include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - analyze
  - test
  - deploy

variables:
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:$FVM_VERSION"
  FVM_VERSION: "3.35.7"
  CUSTOMER_APP: "apps/customer_app"
  ANDROID_SDK_ROOT: "/opt/android-sdk"

analyze:
  stage: analyze
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  image: $FLUTTER_IMAGE
  before_script:
    # FVM + melos chạy ở root
    - gem install bundler --no-document
    - dart pub global activate fvm
    - export PATH="$PATH:$HOME/.pub-cache/bin"
    - fvm install $FVM_VERSION --skip-pub-get
    - fvm use $FVM_VERSION --force
    - dart pub global activate melos
    # Cài Fastlane ở customer_app (vì Gemfile nằm đó)
    - cd $CUSTOMER_APP && bundle install --quiet
    - mkdir -p android
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
  script:
    - cd $CI_PROJECT_DIR
    - melos bootstrap
    - make run_analyze

