name: features_qr_scanner
description: "QR scanner feature with VIN validation and vehicle lookup."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Design system & shared packages
  design_system:
    path: ../../design_system
  share:
    path: ../../share
  localization:
    path: ../../localization
  core:
    path: ../../core
  network:
    path: ../../network

  # QR scanner
  mobile_scanner: ^7.2.0

  # HTTP client
  dio: ^5.8.0+1

  # Retrofit
  retrofit: ^4.7.3
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  equatable: ^2.0.7

  # Functional programming
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  build_runner: ^2.4.14
  json_serializable: ^6.9.5
  retrofit_generator: ^10.0.6

resolution: workspace
