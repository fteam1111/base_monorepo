name: features_home
description: Home feature module with network testing UI
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.5.3

  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.7

  dio: ^5.9.0
  retrofit: ^4.7.3
  json_annotation: ^4.9.0

  # Dependency Injection
  get_it: ^8.0.2

  # Internal packages
  core:
    path: ../../core
  network:
    path: ../../network
  design_system:
    path: ../../design_system
  share:
    path: ../../share
  localization:
    path: ../../localization
  local_storage:
    path: ../../local_storage
  features_auth:
    path: ../features_auth
  features_user:
    path: ../features_user

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  build_runner: ^2.9.0
  json_serializable: ^6.11.1
  retrofit_generator: ^10.0.6

resolution: workspace