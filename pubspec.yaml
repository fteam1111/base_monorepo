name: monospace_base
publish_to: none
environment:
  sdk: ^3.9.2
workspace:
  - packages/core
  - packages/design_system
  - packages/local_storage
  - packages/localization
  - packages/network
  - packages/share
  - apps/customer_app
  - packages/features/features_auth
  - packages/features/features_splash
  - packages/features/features_dashboard
  - packages/features/features_home
  - packages/features/features_find_bike

dependencies:
  # DI
  get_it: ^8.2.0
  injectable: ^2.3.2

dev_dependencies:
  melos: ^7.3.0

  # Code Generation
  json_serializable: ^6.11.1
  injectable_generator: ^2.9.0
  build_runner: ^2.9.0
  freezed: ^3.2.3
  flutter_gen_runner: ^5.12.0
  flutter_localization: ^0.3.3

melos:
  scripts:
    gen:user:
      description: Run build_runner for features_user first (dependency base)
      run: >
        melos exec --scope=features_user --depends-on=build_runner --
        flutter pub run build_runner build --delete-conflicting-outputs

    gen:auth:
      description: Run build_runner for features_auth after features_user
      run: >
        melos exec --scope=features_auth --depends-on=build_runner --
        flutter pub run build_runner build --delete-conflicting-outputs

    gen:home:
      description: Run build_runner for features_home after its dependencies
      run: >
        melos exec --scope=features_home --depends-on=build_runner --
        flutter pub run build_runner build --delete-conflicting-outputs

    gen:customer_app:
      description: Run build_runner for customer_app last
      run: >
        melos exec --scope=customer_app --depends-on=build_runner --
        flutter pub run build_runner build --delete-conflicting-outputs

    gen:
      description: Run build_runner in order to avoid parallel generation races
      run: >
        melos run gen:user &&
        melos run gen:auth &&
        melos run gen:home &&
        melos run gen:customer_app

    gen_all:
      description: Run build_runner for all packages
      run: >
        melos exec --depends-on=build_runner --
        flutter pub run build_runner build --delete-conflicting-outputs
    gen_watch:
      description: Run build_runner watch for all packages
      run: >
        melos exec --depends-on=build_runner --
        flutter pub run build_runner watch
